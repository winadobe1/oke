name: 🔄 Auto Harvest NetMirror Token

on:
  schedule:
    # Berjalan otomatis setiap 10 jam
    - cron: "0 */10 * * *"
  workflow_dispatch:

jobs:
  harvest-token:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔎 Cek Status IP Koneksi & NetMirror
        run: |
          curl -s https://cloudflare.com/cdn-cgi/trace || true
          curl -s -I "https://net52.cc/mobile/home?app=1" || true

      - name: ⛏️ Jalankan Headless Session Harvester
        env:
          PROXY_SERVER: ${{ secrets.PROXY_SERVER || 'http://uy9rgc3e3tb-country-ID-state-jakarta_raya-city-jakarta-session-bpu5qzx6:p7c3vz7ey9tz@resi-bridge-us.rainproxy.io:3333' }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: node scripts/harvest.js

      - name: 📤 Auto-Commit & Push token.json ke Repository
        run: |
          git config user.name "NetMirror-Bot"
          git config user.email "bot@github.actions"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add token.json
          git diff --staged --quiet && echo "Tidak ada perubahan pada token.json" || (git commit -m "🔄 Update NetMirror Token $(date -u +'%Y-%m-%d %H:%M UTC')" && git pull --rebase && git push)

      - name: 🔄 Purge jsDelivr CDN Cache
        run: |
          echo "Memperbarui cache CDN jsDelivr..."
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/token.json" || true
